version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hextron_postgres
    restart: always
    environment:
      POSTGRES_USER: hextron_user
      POSTGRES_PASSWORD: hextron_secure_password
      POSTGRES_DB: hextron_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
